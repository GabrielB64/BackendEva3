
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada | Dulce Arte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f5f2;
            font-family: system-ui, sans-serif;
        }
        .error-card {
            max-width: 560px;
            width: 100%;
            padding: 3rem 2rem;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.07);
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #b77958;
            line-height: 1;
        }
    </style>
</head>
<body>
    <main class="error-card text-center mx-3">
        <div class="error-code mb-3">404</div>
        <h1 class="h3 fw-bold mb-3">Página no encontrada</h1>
        <p class="text-muted mb-4">
            La dirección que buscas no existe o ha sido movida.
            Puedes volver al inicio de Dulce Arte.
        </p>
        <a href="/" class="btn btn-dark px-4">
            Volver al inicio
        </a>
    </main>
</body>
</html>
